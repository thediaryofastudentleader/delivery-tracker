<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VibeChat (Supabase)</title>
  <style>
    /* minimal styling: reuse your existing CSS or this simplified one */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue"; background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
    .header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#10b981}
    .main{flex:1;display:flex;gap:12px;padding:12px;overflow:hidden}
    .sidebar{width:260px;background:#111827;padding:12px;border-radius:12px;overflow:auto}
    .chatbox{flex:1;display:flex;flex-direction:column;background:#0b1220;padding:12px;border-radius:12px;overflow:hidden}
    #messages{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px}
    .msg{background:#111827;padding:10px;border-radius:12px;max-width:80%}
    .meta{font-size:12px;color:#9ca3af;margin-bottom:6px}
    .composer{display:flex;gap:8px;padding-top:8px}
    input[type="text"]{flex:1;padding:10px;border-radius:999px;border:1px solid #203040;background:#0b1220;color:#fff}
    button{padding:10px 14px;border-radius:12px;border:none;background:#10b981;color:#fff;cursor:pointer}
    .conv-item{padding:8px;border-radius:8px;background:#071022;margin-bottom:8px;cursor:pointer}
    .conv-item.active{outline:2px solid #10b981}
    .small{font-size:13px;color:#9ca3af}
    .typing{font-size:12px;color:#a3b8a3;margin:6px 8px}
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:10px;background:#fff;color:#10b981;display:flex;align-items:center;justify-content:center;font-weight:800">YAF</div>
      <div>
        <div style="font-weight:700">VibeChat</div>
        <div class="small">Real-time orders & driver chat</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:8px">
      <input id="orderIdInput" type="text" placeholder="Order ID (optional)" style="padding:8px;border-radius:8px;border:none;"/>
      <button id="joinOrderBtn">Open</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <h4 style="margin-bottom:8px">Conversations</h4>
      <div id="conversationsList"></div>

      <hr style="border:none;border-top:1px solid #0f172a;margin:12px 0"/>

      <div>
        <div class="small" style="margin-bottom:6px">Your name</div>
        <input id="displayName" type="text" placeholder="e.g. Thabo" style="width:100%;padding:8px;border-radius:8px;border:1px solid #203040;background:#071022;color:#fff;margin-bottom:8px"/>
        <div class="small" style="margin-bottom:6px">Color</div>
        <input id="displayColor" type="color" value="#ffadad" style="width:100%;height:36px;border-radius:8px;border:none"/>
        <div style="margin-top:8px">
          <button id="createConvBtn" style="width:100%">New conv (no order)</button>
        </div>
      </div>
    </div>

    <div class="chatbox">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div id="convTitle" style="font-weight:700">Select a conversation</div>
          <div id="convMeta" class="small"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="presenceList" class="small"></div>
          <button id="leaveBtn" style="background:#ef4444">Leave</button>
        </div>
      </div>

      <div id="messages"></div>
      <div id="typingIndicator" class="typing"></div>

      <form id="composer" class="composer" onsubmit="return false;">
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off"/>
        <button id="sendBtn">Send</button>
      </form>
    </div>
  </div>

  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script>
    // ==== CONFIG: set these to your Supabase project values ====
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON = 'YOUR_SUPABASE_ANON_KEY';
    // ===========================================================
    if (!SUPABASE_URL || !SUPABASE_ANON) {
      alert('Please configure SUPABASE_URL and SUPABASE_ANON in chat.html before using.');
    }
    const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_ANON, { realtime: { params: { eventsPerSecond: 10 } } });

    // Simple client state
    let conversations = [];
    let currentConv = null;
    let messages = [];
    let presenceInterval = null;
    let userId = localStorage.getItem('vc_chat_user_id') || crypto.randomUUID();
    localStorage.setItem('vc_chat_user_id', userId);

    const displayNameEl = document.getElementById('displayName');
    const displayColorEl = document.getElementById('displayColor');
    displayNameEl.value = localStorage.getItem('vc_chat_name') || ('Guest' + Math.floor(Math.random()*1000));
    displayColorEl.value = localStorage.getItem('vc_chat_color') || '#ffadad';

    // UI refs
    const convListEl = document.getElementById('conversationsList');
    const messagesEl = document.getElementById('messages');
    const convTitleEl = document.getElementById('convTitle');
    const convMetaEl = document.getElementById('convMeta');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const createConvBtn = document.getElementById('createConvBtn');
    const joinOrderBtn = document.getElementById('joinOrderBtn');
    const orderIdInput = document.getElementById('orderIdInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const presenceList = document.getElementById('presenceList');
    const leaveBtn = document.getElementById('leaveBtn');

    // Helpers
    function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c => c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'); }
    function fmtTime(ts){ return new Date(ts).toLocaleTimeString(); }

    // Load recent conversations
    async function loadConversations() {
      const { data, error } = await supabase.from('chat_conversations').select('*').order('created_at', {ascending: false}).limit(50);
      if (error) { console.error(error); return; }
      conversations = data || [];
      renderConversations();
    }

    function renderConversations() {
      convListEl.innerHTML = '';
      conversations.forEach(c => {
        const el = document.createElement('div');
        el.className = 'conv-item' + (currentConv && currentConv.id === c.id ? ' active' : '');
        el.innerHTML = `<div style="font-weight:700">${escapeHtml(c.title || ('Conv ' + c.id.slice(0,6)))}</div>
                        <div class="small">${c.order_id ? 'Order: ' + escapeHtml(c.order_id) : 'General'}</div>`;
        el.addEventListener('click', () => openConversation(c));
        convListEl.appendChild(el);
      });
    }

    // Create conversation (no order link)
    createConvBtn.addEventListener('click', async () => {
      const title = prompt('Conversation title (optional)') || null;
      const payload = {
        title,
        client_nickname: displayNameEl.value,
        created_by: null
      };
      const { data, error } = await supabase.from('chat_conversations').insert(payload).select().single();
      if (error) return alert('Create convo error: ' + error.message);
      conversations.unshift(data);
      renderConversations();
      openConversation(data);
    });

    // Open or create conversation linked to order
    joinOrderBtn.addEventListener('click', async () => {
      const orderId = (orderIdInput.value || '').trim();
      if (!orderId) return alert('Enter an order id (e.g. YAF-...)');
      // try to find conv
      let { data } = await supabase.from('chat_conversations').select('*').eq('order_id', orderId).limit(1).single();
      if (!data) {
        const { data: created, error } = await supabase.from('chat_conversations').insert({ order_id: orderId, title: 'Order ' + orderId, client_nickname: displayNameEl.value }).select().single();
        if (error) return alert('Create conv error: ' + error.message);
        data = created;
      }
      // add to local list & open
      conversations = [data, ...conversations.filter(c => c.id !== data.id)];
      renderConversations();
      openConversation(data);
    });

    // Open a conversation
    async function openConversation(conv) {
      if (!conv) return;
      currentConv = conv;
      convTitleEl.innerText = conv.title || (conv.order_id ? 'Order ' + conv.order_id : 'Conversation');
      convMetaEl.innerText = conv.order_id ? ('Linked to order: ' + conv.order_id) : 'General conversation';
      messagesEl.innerHTML = '<div class="small">Loading messages...</div>';
      // load last 200 messages for conv
      const { data, error } = await supabase
        .from('chat_messages')
        .select('*')
        .eq('conversation_id', conv.id)
        .order('created_at', {ascending: true})
        .limit(500);
      if (error) { console.error(error); messagesEl.innerHTML = '<div class="small">Failed to load</div>'; return; }
      messages = data || [];
      renderMessages();
      renderConversations();
      setupRealtimeForConversation(conv.id);
      startPresence(conv.id);
    }

    function renderMessages() {
      messagesEl.innerHTML = '';
      messages.forEach(m => {
        const d = document.createElement('div');
        d.className = 'msg';
        const header = document.createElement('div');
        header.className = 'meta';
        header.innerHTML = `<strong style="color:#10b981">${escapeHtml(m.sender_name||m.sender_role||'Anon')}</strong> · <span class="small">${fmtTime(m.created_at)}</span>`;
        const body = document.createElement('div');
        body.innerHTML = `<div style="margin-top:6px">${escapeHtml(m.content || m.content_json?.text || '')}</div>`;
        if (m.attachment_path) {
          const a = document.createElement('div');
          a.style.marginTop = '6px';
          a.innerHTML = `<a href="${m.attachment_path}" target="_blank" style="color:#7dd3fc">Attachment</a>`;
          body.appendChild(a);
        }
        d.appendChild(header);
        d.appendChild(body);
        messagesEl.appendChild(d);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Send a message
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
      else setTyping(true);
    });

    async function sendMessage() {
      if (!currentConv) return alert('Select a conversation first');
      const text = messageInput.value.trim();
      if (!text) return;
      const payload = {
        conversation_id: currentConv.id,
        order_id: currentConv.order_id || null,
        sender_id: null,
        sender_name: displayNameEl.value || 'Guest',
        sender_role: 'customer',
        message_type: 'text',
        content: text
      };
      const { error } = await supabase.from('chat_messages').insert(payload);
      if (error) { console.error('send error', error); alert('Failed to send: ' + error.message); return; }
      messageInput.value = '';
      setTyping(false);
    }

    // Simple typing presence: update chat_presence typing flag
    let typingTimer = null;
    async function setTyping(flag = true) {
      if (!currentConv) return;
      clearTimeout(typingTimer);
      // upsert presence row for this user
      await supabase.from('chat_presence').upsert({
        conversation_id: currentConv.id,
        user_id: userId,
        user_name: displayNameEl.value || 'Guest',
        role: 'customer',
        typing: flag,
        last_seen: new Date().toISOString()
      }, { onConflict: ['conversation_id', 'user_id'] });
      if (flag) {
        typingTimer = setTimeout(() => setTyping(false), 1200);
      }
    }
    function stopTypingIndicator() { typingIndicator.innerText = ''; }

    // Presence ping (last_seen updates) to show who is online
    async function startPresence(convId) {
      stopPresence();
      if (!convId) return;
      // initial upsert
      await supabase.from('chat_presence').upsert({
        conversation_id: convId,
        user_id: userId,
        user_name: displayNameEl.value || 'Guest',
        role: 'customer',
        typing: false,
        last_seen: new Date().toISOString()
      }, { onConflict: ['conversation_id', 'user_id'] });
      // regular update
      presenceInterval = setInterval(async () => {
        await supabase.from('chat_presence').upsert({
          conversation_id: convId,
          user_id: userId,
          user_name: displayNameEl.value || 'Guest',
          role: 'customer',
          typing: false,
          last_seen: new Date().toISOString()
        }, { onConflict: ['conversation_id', 'user_id'] });
      }, 15000);
    }
    function stopPresence() {
      if (presenceInterval) clearInterval(presenceInterval);
      presenceInterval = null;
    }
    leaveBtn.addEventListener('click', async () => {
      if (!currentConv) return;
      await supabase.from('chat_presence').delete().eq('conversation_id', currentConv.id).eq('user_id', userId);
      stopPresence();
      currentConv = null;
      messages = [];
      renderMessages();
      renderConversations();
      convTitleEl.innerText = 'Select a conversation';
      convMetaEl.innerText = '';
    });

    // Realtime: subscription management
    let convSubscription = null;
    let presenceSubscription = null;

    function setupRealtimeForConversation(convId) {
      // cleanup old subs
      if (convSubscription) { convSubscription.unsubscribe(); convSubscription = null; }
      if (presenceSubscription) { presenceSubscription.unsubscribe(); presenceSubscription = null; }

      // messages insert subscription
      convSubscription = supabase.channel('public:chat_messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `conversation_id=eq.${convId}` }, payload => {
          // payload.new
          messages.push(payload.new);
          renderMessages();
        })
        // Also listen to updates (e.g., edited read_by) if needed:
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_messages', filter: `conversation_id=eq.${convId}` }, payload => {
          // update local list
          const idx = messages.findIndex(m => m.id === payload.new.id);
          if (idx !== -1) messages[idx] = payload.new;
          renderMessages();
        })
        .subscribe();

      // presence subscription
      presenceSubscription = supabase.channel('public:chat_presence')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_presence', filter: `conversation_id=eq.${convId}` }, payload => {
          refreshPresenceList(convId);
          // show typing indicator if any present row typing=true
          if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE' || payload.eventType === 'DELETE') {
            refreshPresenceList(convId);
          }
        }).subscribe();

      // initial presence refresh + polling fallback
      refreshPresenceList(convId);
    }

    async function refreshPresenceList(convId) {
      if (!convId) return;
      const { data } = await supabase.from('chat_presence').select('*').eq('conversation_id', convId);
      if (!data) return;
      const typingUsers = data.filter(d => d.typing).map(d => d.user_name).filter(Boolean);
      const onlineUsers = data.map(d => d.user_name).filter(Boolean);
      presenceList.innerText = onlineUsers.length > 0 ? onlineUsers.join(', ') : '';
      typingIndicator.innerText = typingUsers.length > 0 ? `${typingUsers.join(', ')} is typing...` : '';
    }

    // initial load
    (async function init(){
      await loadConversations();
      // remember display name & color
      displayNameEl.addEventListener('input', () => localStorage.setItem('vc_chat_name', displayNameEl.value));
      displayColorEl.addEventListener('input', () => localStorage.setItem('vc_chat_color', displayColorEl.value));
    })();

    // cleanup on page unload
    window.addEventListener('beforeunload', async () => {
      if (currentConv) {
        await supabase.from('chat_presence').delete().eq('conversation_id', currentConv.id).eq('user_id', userId);
      }
    });
  </script>
</body>
</html>
